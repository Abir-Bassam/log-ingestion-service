services:
  app:
    build: .   
    ports:
      - "8080:8080"   
    environment:
      DATABASE_URL: postgres://loguser:logpass@db:5432/logs
      PORT: 8080
      RETENTION_DAYS: 30
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      LOADGEN_API_KEY: ${LOADGEN_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy   
    deploy:
      resources:
        limits:
          cpus: "0.5"      
          memory: 256M

  db:
    image: postgres:16-alpine
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
      -c autovacuum_vacuum_scale_factor=0.05
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: logpass
      POSTGRES_DB: logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loguser -d logs"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - log_ingestion_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1"        
          memory: 1G

volumes:
  log_ingestion_pgdata:   
